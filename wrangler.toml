name = "thewildcut"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# Bindings. Binding NAMES must stay exactly: DB (and MEDIA once R2 exists).
# D1 database "wildcut-db" was created 2026-10-27 and already holds all data.

[[d1_databases]]
binding = "DB"
database_name = "wildcut-db"
database_id = "b9d1c5a6-ad94-4f05-98c5-eb63992fde6c"

# R2 (MEDIA binding) is NOT enabled yet: Cloudflare requires a payment card
# to activate R2, and the account has none. Existing images are served as
# static files from public/media/ instead. When a card is added and the
# bucket "wildcut-media" is created, restore this block:
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "wildcut-media"
